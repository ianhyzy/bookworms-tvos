name: Bookworms
options:
  bundleIdPrefix: gay.ian
  deploymentTarget:
    tvOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: KSZ7QR8Y88
    TARGETED_DEVICE_FAMILY: '3'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.2.0'
    CURRENT_PROJECT_VERSION: '14'
  configs:
    Release:
      CLANG_ENABLE_CODE_COVERAGE: NO
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
targets:
  Bookworms:
    type: application
    platform: tvOS
    sources:
      - Bookworms
      - Shared
      # The owner's example profile, which `scripts/export-example-profile.py` writes and Git
      # ignores except for a placeholder. Builds without it hide **View example profile**;
      # archives require it, and other Release builds, such as `scripts/device-build.py`, warn.
      - path: ExampleProfile
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Check the example profile
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = Release ] && [ ! -f "$SRCROOT/ExampleProfile/library-v1.json" ]; then
            message="ExampleProfile/ is missing. Run python3 -I scripts/export-example-profile.py --out ExampleProfile (see docs/RELEASING.md)."
            # An archive builds with the install action.
            if [ "$ACTION" = install ]; then echo "error: $message"; exit 1; fi
            echo "warning: $message"
          fi
    dependencies:
      - target: BookwormsTopShelf
        embed: true
    entitlements:
      path: Bookworms/Bookworms.entitlements
      properties:
        com.apple.security.application-groups: [group.gay.ian.Bookworms]
        com.apple.developer.icloud-container-identifiers: [iCloud.gay.ian.Bookworms]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    info:
      path: Bookworms/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiredDeviceCapabilities: [arm64]
        CFBundleURLTypes:
          - CFBundleURLName: gay.ian.Bookworms.books
            CFBundleURLSchemes: [bookworms]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gay.ian.Bookworms
        INFOPLIST_KEY_CFBundleDisplayName: Bookworms - eBook Display
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  BookwormsTopShelf:
    type: app-extension
    platform: tvOS
    sources: [BookwormsTopShelf, Shared]
    entitlements:
      path: BookwormsTopShelf/BookwormsTopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.gay.ian.Bookworms]
    info:
      path: BookwormsTopShelf/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiredDeviceCapabilities: [arm64]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gay.ian.Bookworms.TopShelf
        INFOPLIST_KEY_CFBundleDisplayName: Bookworms Top Shelf
        APPLICATION_EXTENSION_API_ONLY: YES
  BookwormsTests:
    type: bundle.unit-test
    platform: tvOS
    sources: [BookwormsTests]
    dependencies:
      - target: Bookworms
  BookwormsUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [BookwormsUITests]
    dependencies:
      - target: Bookworms
  BookwormsLiveTests:
    type: bundle.unit-test
    platform: tvOS
    sources: [BookwormsLiveTests]
    dependencies:
      - target: Bookworms
schemes:
  BookwormsLive:
    build:
      targets:
        Bookworms: all
    test:
      targets:
        - BookwormsLiveTests
      gatherCoverageData: false
  Bookworms:
    build:
      targets:
        Bookworms: all
    test:
      testPlans:
        - path: TestPlans/Local.xctestplan
          defaultPlan: true
        - path: TestPlans/Unit.xctestplan
        - path: TestPlans/Device.xctestplan
      targets:
        - BookwormsTests
        - BookwormsUITests
  BookwormsDevice:
    build:
      targets:
        Bookworms: all
    test:
      testPlans:
        - path: TestPlans/Device.xctestplan
          defaultPlan: true
        - path: TestPlans/Local.xctestplan
        - path: TestPlans/Unit.xctestplan
      targets:
        - BookwormsTests
        - BookwormsUITests
