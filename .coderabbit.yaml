# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
#
# Review settings for the CodeRabbit GitHub app and the local `coderabbit review`
# CLI, which reads this file from the repository root. CodeRabbit also reads
# AGENTS.md as coding guidelines, so these instructions cover the workspace-wide
# rules that live outside this repository and the checks that matter most.
language: en-US
tone_instructions: >-
  Be brief and concrete. Lead with frame-rate, focus, legibility, and
  book-realism problems. Skip formatting nits that swift-format already
  enforces.

reviews:
  profile: chill
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false

  # Generated, bundled, or binary content. Excluding it keeps reviews (and the
  # trial's rate limit) on source code.
  path_filters:
    - "!**/DerivedData*/**"
    - "!.build*/**"
    - "!.local/**"
    - "!Bookworms.xcodeproj/**" # Generated by XcodeGen from project.yml.
    - "!**/*.xcassets/**"
    - "!design/**"
    - "!screenshots/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.heic"
    - "!**/*.mov"
    - "!**/*.mp4"
    - "!**/*.usdz"
    - "!**/[Rr]enders/**"
    - "!**/[Kk]eepsakes/**"

  path_instructions:
    - path: "**/*.swift"
      instructions: |
        Frame rate: every screen must hold 60 fps or better on Apple TV. Flag:
        - Networking, decoding, image analysis, sorting, text measurement, Keychain queries, or file I/O in a SwiftUI `body`, a focus or move-command handler, or other main-actor code that runs during remote input.
        - Allocations, collection rebuilds, string formatting, or image creation in per-frame code: RealityKit update closures, `TimelineView`, `Canvas`, display links, and animation callbacks.
        - New timers, blur layers, `drawingGroup`, animated blur or shadow radii, offscreen rendering, or rasterization without evidence that they help. Shelf effects fade prebuilt shadows with opacity.
        - Caches or task handles in observed state, broad `@Observable` dependencies that invalidate large view trees, and unstable `ForEach` identity.
        - A `Task {}` assumed to leave the main actor, missing cancellation, and stale async results that can replace newer state.
        - Animations or "delight" effects that delay input, focus movement, or navigation.

        Focus: the focus engine owns directional movement. Flag focus set from move-command handlers, timers, data changes, or loading completion; lost focus restoration after details; and a sidebar that Left from the leftmost item or Back cannot reach. Follow `docs/FOCUS_NAVIGATION.md`.

        Legibility at TV distance: flag user-visible text below 23 pt (the tvOS Caption 2 size), body text well below 29 pt, and text colors likely to miss WCAG 4.5:1 contrast (3:1 for large text) against their background. User-visible text uses `appFont(size:weight:)`, not `.font(.system(size:))`; Settings uses the system font. Pairs and sets of colors should complement each other.

        Library: treat it as a read-only snapshot between syncs. Sorting, intersections, and page layouts are prepared when data or configuration changes, never on focus changes. Displayed collections respect `BookLimit.maximum` except where AGENTS.md says otherwise. No per-cover network calls while scrolling or rendering details.

        Use only APIs available on tvOS 26 or later, with no compatibility branches for older versions. Hardcover access stays read-only, and credentials stay provider-specific.

    - path: "Bookworms/**/*.swift"
      instructions: |
        Spine fonts: never choose, rank, prompt a model for, fall back to, download, or render Impact or any italic, oblique, or slanted face on a spine. Check catalogs, model prompts and schemas, fallbacks, downloaded faces (keep only an upright face; never draw one with the italic trait or a slant), and styles decoded from storage or iCloud, which must map blocked names through `SpineFontPolicy` without rewriting stored records.

        3D books and Book Wall: spines are flat cloth with nearly square corners; flag curved, bulging, or rounded spine geometry. Stacked books lie flat on the book below with level top and bottom edges: flag roll in the screen's plane, gaps, overlaps, floating, or leaning on nothing. A stack's imperfection is only small sideways offsets and a few degrees of yaw. A book pulled from a stack moves straight out along the direction its spine faces. Spines keep book proportions; never squash them toward squares to fit more. Thick spines use their extra height for larger or two-line titles before any title is truncated.

        Series: Book Wall shows one spine per book. Books in one series that share an author take the colors and font of the series' source book, which is the lowest series position in the library, then the earliest finish, then the lowest ID, among books whose font is not blocked (`SpineFontPolicy.allowsFamily`). A book the source's font cannot letter keeps its own design, and every book keeps its own cover and bands. `SeriesDesigns.matches` holds the membership rule and must match the iPhone and Mac app; flag membership logic duplicated elsewhere. Share images that letter every book of a time frame show two or more books of one series as one book-shaped spine labeled with the name and count.

    - path: "**/*Cloud*Store.swift"
      instructions: |
        This code reads the CloudKit JSON contract that the iPhone and Mac app writes (`Bookworms/Models/CloudContract.swift` in bookworms-ios). Flag renamed or removed fields, changed coding keys or defaults, and decoding that would reject records the other app writes.

    - path: "**/*.metal"
      instructions: |
        Shaders run every frame on Apple TV. Flag branches, texture samples, or loops that grow with screen size or book count without need.

    - path: "Bookworms*Tests/**"
      instructions: |
        Tests must be deterministic and independent of live credentials and paid AI. New views need a focus-navigation check that counts focus updates.

  tools:
    swiftlint:
      enabled: false # The repository uses swift-format (.swift-format).
