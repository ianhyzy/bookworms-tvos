    <path id="outer-cover" fill="#9874BC" d="M250 280Q334 270 400 311Q466 270 550 280L550 378Q468 372 400 405Q332 372 250 378Z" />
    <path fill="none" stroke-width="6" d="M400 311V403" />
  <g stroke="none"><rect x="540" y="60" width="180" height="66" rx="16" fill="#14595B" /><text x="630" y="105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">LOCAL</text></g></g>
</svg>
