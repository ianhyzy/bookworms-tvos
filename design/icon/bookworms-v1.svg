      <path fill="#F9C4CB" stroke="none" d="M455 204L457 180C459 148 477 130 502 130C523 130 539 141 548 158C534 148 516 146 502 151C482 157 475 177 474 204L471 268C461 250 455 228 455 204Z"/>
